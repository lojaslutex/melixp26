name: Atualizar programação MELI Experience

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Extrair programação oficial
        run: python scripts/extrator_programacao.py

      - name: Validar JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/programacao.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert isinstance(data, list), "programacao.json não é um array"
          assert len(data) > 0, "programacao.json está vazio"
          assert all(x.get("id") for x in data), "Existe item sem ID"
          assert len({x["id"] for x in data}) == len(data), "Existem IDs duplicados"

          print(f"OK: {len(data)} palestras")
          PY

      - name: Commit e push se houver alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/programacao.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na programação."
          else
            git commit -m "Atualiza programação do MELI Experience"
            git push
          fi
