name: Atualizar programação Mercado Livre Experience

on:
  workflow_dispatch:
  schedule:
    # Todos os dias às 10:00 UTC (07:00 no horário de Brasília)
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  atualizar-programacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Atualizar programação
        run: python scripts/extrator_programacao.py

      - name: Verificar alterações
        id: verificar
        run: |
          if git diff --quiet -- data/programacao.json; then
            echo "alterado=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração na programação."
          else
            echo "alterado=true" >> "$GITHUB_OUTPUT"
            echo "A programação foi alterada."
            git diff --stat -- data/programacao.json
          fi

      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/programacao.json
          git commit -m "Atualiza programação MLXP26"
          git push
