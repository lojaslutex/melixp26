name: Atualizar programação Mercado Livre Experience

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  atualizar-programacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Extrair programação
        run: python scripts/extrator_programacao.py

      - name: Verificar alterações
        id: changes
        run: |
          if git diff --quiet -- data/programacao.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit e push do programacao.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/programacao.json
          git commit -m "Atualiza programação Mercado Livre Experience"
          git push

      - name: Nenhuma alteração
        if: steps.changes.outputs.changed == 'false'
        run: echo "A programação não sofreu alterações."
