<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeliXP 2026 · Palestra</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/mobile.css"><link rel="stylesheet" href="css/dark.css"></head><body>
  <header class="sticky-top app-header border-bottom">
    <div class="container py-3">
      <div class="d-flex align-items-center gap-3">
        <a class="brand text-decoration-none" href="index.html">
          <span></span>
          <strong>Mercado Livre Experience '26</strong>
          <small></small>
        </a>
        <div class="ms-auto d-flex gap-2">
          <button class="btn btn-light btn-sm" id="themeToggle" aria-label="Alternar tema">
            <i class="bi bi-moon-stars"></i>
          </button>
          <a class="btn btn-primary btn-sm" href="favoritos.html">
            <i class="bi bi-star-fill"></i> Favoritas
            <span class="badge text-bg-light ms-1" id="favoriteCount">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container pb-5">
    <section class="hero py-4">
      <p class="eyebrow mb-1">MELIXP 2026 · DETALHES DA PALESTRA</p>
      <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
        <h1 class="display-6 fw-bold mb-0">Detalhes da palestra</h1>
        <a href="index.html" class="btn btn-outline-primary">
          <i class="bi bi-arrow-left"></i> Programação
        </a>
      </div>
    </section>

    <article id="talkDetail" class="card shadow-sm border-0 talk-detail-card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center py-5">
          <span class="spinner-border spinner-border-sm"></span>
          <span class="ms-2">Carregando palestra…</span>
        </div>
      </div>
    </article>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <style>
    .talk-detail-card {
      border-radius: 18px;
      overflow: hidden;
    }

    #talkDetail .badge-stage {
      display: inline-flex;
      align-items: center;
      margin-bottom: .75rem;
    }

    #talkDetail h1,
    #talkDetail h2,
    #talkDetail h3 {
      color: var(--ink);
    }

    #talkDetail p {
      color: var(--muted);
      line-height: 1.7;
    }

    #talkDetail .speaker-chip,
    #talkDetail .tag {
      display: inline-flex;
      align-items: center;
      margin: .2rem .25rem .2rem 0;
    }

    #talkDetail img {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 575px) {
      .talk-detail-card .card-body {
        padding: 1rem !important;
      }

      .hero.py-4 {
        padding-top: 1.25rem !important;
        padding-bottom: 1.25rem !important;
      }
    }
  </style>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
  <script src="js/palestra.js"></script>
  <script src="js/ui.js"></script>
</body></html>
